<div class="card shadow-sm mb-4" id="autoreFormContainer">
    <div class="card-body">
        <h2 class="h4 mb-3" id="formTitle">Aggiungi Nuovo Autore</h2>
        <form id="autoreForm" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="action" id="action" value="insert">
            <input type="hidden" name="codice" id="codice" value="">
            <input type="hidden" name="currentPathImmagine" id="currentPathImmagine" value="">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome *</label>
                    <input type="text" id="nome" name="nome" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="cognome" class="form-label">Cognome *</label>
                    <input type="text" id="cognome" name="cognome" class="form-control" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="nazione" class="form-label">Nazione *</label>
                    <input type="text" id="nazione" name="nazione" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="dataNascita" class="form-label">Data di Nascita *</label>
                    <input type="date" id="dataNascita" name="dataNascita" class="form-control" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="tipo" class="form-label">Stato (Vivo/Morto) *</label>
                    <select id="tipo" name="tipo" class="form-select" required>
                        <option value="vivo">Vivo</option>
                        <option value="morto">Morto</option>
                    </select>
                </div>
                <div class="col-md-6" id="dataMorteContainer" style="display: none;">
                    <label for="dataMorte" class="form-label">Data di Morte</label>
                    <input type="date" id="dataMorte" name="dataMorte" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label for="fotoAutore" class="form-label">Immagine Autore (opzionale)</label>
                <input type="file" id="fotoAutore" name="foto" class="form-control" accept=".jpg,.jpeg,.png,.webp,.gif,image/*">
                <div class="form-text">Formati supportati: JPG, PNG, WEBP, GIF.</div>
            </div>

            <div id="currentImageContainer" class="mb-3" style="display: none;">
                <label class="form-label">Immagine attuale</label>
                <div class="mb-2">
                    <img id="currentImagePreview" src="" alt="Immagine autore corrente" class="img-thumbnail" style="max-width: 180px;">
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="removeImage" name="remove_image" value="1">
                    <label class="form-check-label" for="removeImage">Elimina immagine attuale</label>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" id="submitBtn">Salva</button>
                <button type="button" class="btn btn-outline-secondary" id="cancelBtn" style="display: none;">Annulla</button>
            </div>
        </form>
    </div>
</div>
