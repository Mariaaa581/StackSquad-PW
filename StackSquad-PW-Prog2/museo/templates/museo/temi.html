{% extends 'museo/base.html' %}

{% block title %}Temi - Museo StackSquad{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <h1 class="h2 mb-0">Ricerca Temi</h1>
    <form method="get" class="d-flex gap-2 flex-grow-1 flex-md-grow-0" style="max-width: 500px;">
        <input type="text" name="q" class="form-control" placeholder="Cerca tema..." value="{{ search }}">
        <button type="submit" class="btn btn-primary">Cerca</button>
        {% if search %}
            <a href="{% url 'museo:temi' %}" class="btn btn-outline-danger">Reset</a>
        {% endif %}
    </form>
</div>

<div class="table-responsive shadow-sm rounded">
    <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
            <tr>
                <th>Codice</th>
                <th>Descrizione</th>
            </tr>
        </thead>
        <tbody>
            {% for t in temi %}
            <tr>
                <td>{{ t.codice }}</td>
                <td><a href="{% url 'museo:tema_detail' t.codice %}">{{ t.descrizione }}</a></td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-center text-muted py-4">Nessun tema trovato.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
